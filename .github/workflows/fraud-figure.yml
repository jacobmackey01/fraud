name: Fraud figure checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operating-point-figure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run focused operating-point tests
        run: python -m unittest discover -s tests -p "test_operating_point_figure.py" -v

      - name: Check committed SVG freshness
        run: >-
          python -c "from pathlib import Path; import tempfile; from src.operating_point_figure import render_operating_point_svg;
          root=Path.cwd(); expected=(root/'reports'/'fraud_operating_point.svg').read_bytes();
          output=Path(tempfile.mkdtemp())/'fraud_operating_point.svg';
          actual=render_operating_point_svg(root, output).read_bytes();
          assert actual == expected, 'reports/fraud_operating_point.svg is stale relative to committed evidence'"
